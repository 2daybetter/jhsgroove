<article>
<h1 id="h">OAuth callback</h1><p id="p" class="muted">This page receives the redirect after connecting an account to sns_automate.</p>
<script>
const q = new URLSearchParams(location.search), h = document.getElementById('h'), p = document.getElementById('p');
const clean = (s) => String(s).replace(/[<>&"]/g, '');
if (q.get('error')) { h.textContent = 'Connection cancelled'; p.textContent = q.get('error_description') || q.get('error'); }
else if (q.get('code')) {
  h.textContent = 'Authorization received';
  p.innerHTML = 'Copy this code to the operator. It expires in a few minutes.<br><br><code>' + clean(q.get('code')) + '</code>';
}
</script></article></main></body></html>
